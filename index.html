<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>シフトスキャナー</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f1f5f9; color: #0f172a; }
    .card { background: white; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 1.15rem; margin: 0 0 12px; }
    label { font-size: 0.85rem; color: #475569; display: block; margin-bottom: 6px; margin-top: 10px; }
    label:first-of-type { margin-top: 0; }
    input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; margin-bottom: 8px; background: #ffffff; color: #0f172a; }
    .setting-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    @media (max-width: 420px) { .setting-row { grid-template-columns: 1fr; gap: 0; } }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; box-sizing: border-box; }
    .btn-primary { background: #2563eb; color: white; margin-bottom: 8px; }
    .btn-outline { background: #ffffff; color: #2563eb; border: 2px solid #2563eb; margin-bottom: 8px; }
    .btn-secondary { background: #059669; color: white; margin-top: 12px; }
    .btn-add { background: #f8fafc; color: #334155; border: 1px dashed #94a3b8; padding: 10px; font-size: 0.85rem; margin-top: 10px; }
    .btn:disabled { background: #94a3b8; border-color: #94a3b8; color: white; }
    .note { font-size: 0.75rem; color: #64748b; margin-top: 4px; line-height: 1.4; }
    #status { margin-top: 12px; font-size: 0.85rem; color: #475569; line-height: 1.4; font-weight: 500; }
    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 8px 4px; text-align: left; vertical-align: middle; }
    th { background: #f8fafc; color: #475569; white-space: nowrap; }
    .cell-input { width: 100%; padding: 6px 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.82rem; font-family: inherit; background: #ffffff; color: #0f172a; }
    .cell-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); }
    .date-input { min-width: 106px; }
    .title-input { min-width: 68px; }
    .time-group { display: flex; align-items: center; gap: 4px; }
    .time-input { width: 82px; padding: 6px 4px; }
    .time-sep { color: #64748b; font-size: 0.75rem; flex-shrink: 0; }
    @media (max-width: 480px) {
      .time-group { flex-direction: column; align-items: stretch; gap: 3px; }
      .time-input { width: 100%; min-width: 78px; }
      .time-sep { display: none; }
    }
    .all-day-badge { display: inline-block; padding: 5px 10px; border-radius: 6px; background: #e2e8f0; color: #334155; font-size: 0.78rem; font-weight: 600; text-align: center; }
    .btn-del { background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; width: 28px; height: 28px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .hidden-file { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>1. API・モデル設定</h1>

    <label for="apiKey">Google AI StudioのAPIキー</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." />

    <div class="setting-row">
      <div>
        <label for="modelSelect">使用モデル</label>
        <select id="modelSelect">
          <option value="gemini-4-hydrogen">Gemini 4 Hydrogen（無料枠対応・高速）</option>
          <option value="gemini-4-neon">Gemini 4 Neon（有料枠専用・高精度）</option>
        </select>
      </div>
      <div>
        <label for="thinkingLevel">思考レベル</label>
        <select id="thinkingLevel">
          <option value="">標準（モデル自動）</option>
          <option value="low">低（高速・省コスト）</option>
          <option value="medium">中（バランス）</option>
          <option value="high">高（高精度・複雑な表向け）</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveSettings()" style="padding: 10px; font-size: 0.85rem;">設定を端末に保存</button>
    <div class="note">
      ※ モデルと思考レベルは変更時にも自動保存されます。Neonを利用する場合は、課金設定済みのAPIキーが必要です。
    </div>
  </div>

  <div class="card">
    <h1>2. 勤務表の読み込み</h1>
    <input type="file" id="fileInputCamera" class="hidden-file" accept="image/*" capture="environment">
    <input type="file" id="fileInputGallery" class="hidden-file" accept="image/*">

    <button class="btn btn-primary" id="btnScan" onclick="triggerInput('fileInputCamera')">
      📷 カメラでスキャン
    </button>
    <button class="btn btn-outline" id="btnGallery" onclick="triggerInput('fileInputGallery')">
      🖼️ 写真アルバムから選択
    </button>
    
    <div class="note">
      ※ どちらの方法でも画像データはブラウザのメモリ内でのみ一時処理され、解析後に即座に消去されます。アプリ内・サーバー上への保存や蓄積は一切行われません。
    </div>
    <div id="status">準備完了</div>
  </div>

  <div class="card" id="resultCard" style="display: none;">
    <h1>3. 抽出結果（森川 瑛理 様）</h1>
    <div class="note">
      ※ 各項目をタップして直接修正できます。「休み」「有休」にすると自動で終日扱いになります。
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>日付</th><th>シフト名</th><th>時間帯</th><th></th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
    <button class="btn btn-add" onclick="addEmptyRow()">＋ 予定を1行追加</button>
    <button class="btn btn-secondary" onclick="exportToCalendar()">カレンダーに一括追加</button>
  </div>

  <script>
    const DEFAULT_MODEL = "gemini-4-hydrogen";
    let shifts = [];

    window.onload = () => {
      const savedKey = localStorage.getItem("GEMINI_KEY");
      const savedModel = localStorage.getItem("GEMINI_MODEL");
      const savedThinking = localStorage.getItem("GEMINI_THINKING");

      if (savedKey) document.getElementById("apiKey").value = savedKey;
      if (savedModel) document.getElementById("modelSelect").value = savedModel;
      if (savedThinking !== null) document.getElementById("thinkingLevel").value = savedThinking;
    };

    document.getElementById("modelSelect").addEventListener("change", (e) => {
      localStorage.setItem("GEMINI_MODEL", e.target.value);
    });
    document.getElementById("thinkingLevel").addEventListener("change", (e) => {
      localStorage.setItem("GEMINI_THINKING", e.target.value);
    });

    function saveSettings() {
      const key = document.getElementById("apiKey").value.trim();
      const model = document.getElementById("modelSelect").value;
      const thinking = document.getElementById("thinkingLevel").value;

      if (!key) return alert("APIキーを入力してください");

      localStorage.setItem("GEMINI_KEY", key);
      localStorage.setItem("GEMINI_MODEL", model);
      localStorage.setItem("GEMINI_THINKING", thinking);
      alert("設定を端末に保存しました。次回以降は入力不要です。");
    }

    function triggerInput(id) {
      const key = localStorage.getItem("GEMINI_KEY") || document.getElementById("apiKey").value.trim();
      if (!key) return alert("先にAPIキーを入力して保存してください。");
      document.getElementById(id).click();
    }

    document.getElementById("fileInputCamera").addEventListener("change", handleFileSelect);
    document.getElementById("fileInputGallery").addEventListener("change", handleFileSelect);

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById("status");
      const btnScan = document.getElementById("btnScan");
      const btnGallery = document.getElementById("btnGallery");

      const key = localStorage.getItem("GEMINI_KEY") || document.getElementById("apiKey").value.trim();
      const modelId = document.getElementById("modelSelect").value || DEFAULT_MODEL;
      const thinkingLevel = document.getElementById("thinkingLevel").value;
      const thinkingLabel = thinkingLevel || "標準";
      
      btnScan.disabled = true;
      btnGallery.disabled = true;
      status.innerText = `勤務表を解析中（${modelId} / 思考: ${thinkingLabel}）...`;

      let base64Image = null;

      try {
        base64Image = await toBase64(file);
        shifts = await analyzeWithGemini(base64Image, file.type, key, modelId, thinkingLevel);
        
        renderTable();
        status.innerText = `解析成功: ${shifts.length}件の予定を検出しました（${modelId} / 思考: ${thinkingLabel}）。`;
        document.getElementById("resultCard").style.display = "block";
      } catch (err) {
        status.innerText = "エラー: " + err.message;
      } finally {
        base64Image = null;
        e.target.value = "";
        btnScan.disabled = false;
        btnGallery.disabled = false;
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function analyzeWithGemini(base64Data, mimeType, apiKey, modelId, thinkingLevel) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;

      const prompt = `画像は「作業計画実施表」という月間の勤務表です。以下の厳密なルールに従って解析し、JSON配列を出力してください。

1. 年月の特定:
   左上の記載から対象の「西暦の年」と「月」（例: 2026年11月）を特定してください。
2. シフト時間定義の抽出:
   右上にあるアルファベット等の記号と時間の定義をすべて読み取ってください。
   ※大文字と小文字（Aとa、Fとfなど）、記号付き（A★、N△）、併記（n/N、e/E）を厳密に区別してください。
3. 対象者の特定:
   左側の氏名列から「森川 瑛理」（文字間のスペースの有無は問いません）の行を特定してください。
4. 日付とシフトの抽出:
   日付（1〜30/31）と、森川瑛理さんの行にある各セルの記号を突き合わせます。
   - シフト記号のセル：「(記号)勤」として抽出し、開始時刻と終了時刻を割り当ててください。
   - 「-（ハイフン）」および「休」のセル：「休み」として必ず抽出してください。
   - 「有」のセル：「有休」として必ず抽出してください。
   ※「休み」や「有休」を除外せず、必ずリストに含めてください。
   ※上記以外の「FB」など、シフトでも休みでもない予定のみを除外してください。

以上の結果を、指定されたJSONスキーマに従って出力してください。
- dateは "YYYY-MM-DD" 形式（月日は必ず2桁で0埋め、例: 2026-11-03）
- titleは "(記号)勤"、"休み"、"有休" のいずれか（例: (A)勤）
- startTimeとendTimeは "HH:mm" 形式（例: 06:00, 15:00）。休みや有休の場合は "00:00" としてください。`;

      const generationConfig = {
        response_mime_type: "application/json",
        response_schema: {
          type: "ARRAY",
          items: {
            type: "OBJECT",
            properties: {
              date: { type: "STRING", description: "YYYY-MM-DD" },
              title: { type: "STRING", description: "例: (A)勤, 休み, 有休" },
              startTime: { type: "STRING", description: "HH:mm" },
              endTime: { type: "STRING", description: "HH:mm" }
            },
            required: ["date", "title", "startTime", "endTime"]
          }
        }
      };

      if (thinkingLevel) {
        generationConfig.thinking_config = {
          thinking_level: thinkingLevel
        };
      }

      const payload = {
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64Data } }
          ]
        }],
        generationConfig
      };

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `API通信失敗 (${res.status})`);
      }

      const json = await res.json();
      const parts = json.candidates?.[0]?.content?.parts || [];
      const text = parts
        .filter(p => !p.thought && p.text)
        .map(p => p.text)
        .join("");

      if (!text) {
        throw new Error("解析結果のテキストを取得できませんでした。");
      }

      return JSON.parse(text);
    }

    function isOffTitle(title) {
      const t = (title || "").trim();
      return t === "休み" || t === "有休";
    }

    function populateTimeCell(tdTime, item) {
      tdTime.innerHTML = "";
      if (isOffTitle(item.title)) {
        const badge = document.createElement("span");
        badge.className = "all-day-badge";
        badge.textContent = "終日";
        tdTime.appendChild(badge);
        return;
      }

      // 休みから勤務名へ書き換えた直後の初期値補正
      if (!item.startTime || (item.startTime === "00:00" && item.endTime === "00:00")) {
        item.startTime = "09:00";
        item.endTime = "18:00";
      }

      const wrap = document.createElement("div");
      wrap.className = "time-group";

      const startInput = document.createElement("input");
      startInput.type = "time";
      startInput.className = "cell-input time-input";
      startInput.value = item.startTime || "09:00";
      startInput.addEventListener("change", (e) => {
        item.startTime = e.target.value;
      });

      const sep = document.createElement("span");
      sep.className = "time-sep";
      sep.textContent = "〜";

      const endInput = document.createElement("input");
      endInput.type = "time";
      endInput.className = "cell-input time-input";
      endInput.value = item.endTime || "18:00";
      endInput.addEventListener("change", (e) => {
        item.endTime = e.target.value;
      });

      wrap.appendChild(startInput);
      wrap.appendChild(sep);
      wrap.appendChild(endInput);
      tdTime.appendChild(wrap);
    }

    function renderTable() {
      const tbody = document.getElementById("resultBody");
      tbody.innerHTML = "";

      shifts.forEach((item, index) => {
        const tr = document.createElement("tr");

        // 日付セル
        const tdDate = document.createElement("td");
        const dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.className = "cell-input date-input";
        dateInput.value = item.date || "";
        dateInput.addEventListener("change", (e) => {
          item.date = e.target.value;
        });
        tdDate.appendChild(dateInput);

        // シフト名セル
        const tdTitle = document.createElement("td");
        const titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.className = "cell-input title-input";
        titleInput.value = item.title || "";
        titleInput.placeholder = "(A)勤";

        // 時間帯セル
        const tdTime = document.createElement("td");
        let prevIsOff = isOffTitle(item.title);
        populateTimeCell(tdTime, item);

        const syncOffState = () => {
          const nowIsOff = isOffTitle(item.title);
          if (nowIsOff !== prevIsOff) {
            prevIsOff = nowIsOff;
            populateTimeCell(tdTime, item);
          }
        };

        titleInput.addEventListener("input", (e) => {
          item.title = e.target.value;
          if (!e.isComposing) syncOffState();
        });
        titleInput.addEventListener("compositionend", () => {
          item.title = titleInput.value;
          syncOffState();
        });
        tdTitle.appendChild(titleInput);

        // 削除ボタンセル
        const tdAction = document.createElement("td");
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-del";
        delBtn.textContent = "✕";
        delBtn.title = "この行を削除";
        delBtn.addEventListener("click", () => {
          shifts.splice(index, 1);
          renderTable();
        });
        tdAction.appendChild(delBtn);

        tr.appendChild(tdDate);
        tr.appendChild(tdTitle);
        tr.appendChild(tdTime);
        tr.appendChild(tdAction);
        tbody.appendChild(tr);
      });
    }

    function addEmptyRow() {
      let nextDate = new Date().toISOString().split("T")[0];
      if (shifts.length > 0 && shifts[shifts.length - 1].date) {
        const last = new Date(shifts[shifts.length - 1].date + "T00:00:00Z");
        if (!isNaN(last.getTime())) {
          last.setUTCDate(last.getUTCDate() + 1);
          nextDate = last.toISOString().split("T")[0];
        }
      }
      shifts.push({
        date: nextDate,
        title: "(A)勤",
        startTime: "09:00",
        endTime: "18:00"
      });
      renderTable();
    }

    function addDays(dateStr, days) {
      const dateObj = new Date(dateStr + "T00:00:00Z");
      dateObj.setUTCDate(dateObj.getUTCDate() + days);
      return dateObj.toISOString().split("T")[0].replace(/-/g, "");
    }

    function exportToCalendar() {
      if (!shifts.length) return alert("追加する予定がありません。");

      const invalidIndex = shifts.findIndex(s => !s.date || !(s.title || "").trim());
      if (invalidIndex !== -1) {
        return alert(`${invalidIndex + 1}行目の日付またはシフト名が未入力です。`);
      }

      let ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ShiftScanner//JA",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
      ];

      shifts.forEach((s, idx) => {
        const d = s.date.replace(/-/g, "");
        const title = s.title.trim();
        
        ics.push(
          "BEGIN:VEVENT",
          `UID:${Date.now()}-${idx}-${Math.random().toString(36).substr(2, 9)}@shift`,
          `DTSTAMP:${d}T000000Z`
        );

        if (isOffTitle(title)) {
          const nextD = addDays(s.date, 1);
          ics.push(
            `DTSTART;VALUE=DATE:${d}`,
            `DTEND;VALUE=DATE:${nextD}`
          );
        } else {
          const start = s.startTime || "09:00";
          const end = s.endTime || "18:00";
          const st = start.replace(":", "") + "00";
          const et = end.replace(":", "") + "00";
          // 終了時刻が開始時刻以前の場合は翌日終了（夜勤等）として扱う
          const endD = (end <= start) ? addDays(s.date, 1) : d;

          ics.push(
            `DTSTART:${d}T${st}`,
            `DTEND:${endD}T${et}`
          );
        }
        
        ics.push(
          `SUMMARY:${title}`,
          "END:VEVENT"
        );
      });

      ics.push("END:VCALENDAR");

      const blob = new Blob([ics.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "shift.ics";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
