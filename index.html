<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>シフトスキャナー</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f1f5f9; color: #0f172a; }
    .card { background: white; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 1.15rem; margin: 0 0 12px; }
    label { font-size: 0.85rem; color: #475569; display: block; margin-bottom: 4px; font-weight: 600; }
    input[type="password"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 10px; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; box-sizing: border-box; }
    .btn-primary { background: #2563eb; color: white; margin-bottom: 8px; }
    .btn-outline { background: #ffffff; color: #2563eb; border: 2px solid #2563eb; margin-bottom: 8px; }
    .btn-secondary { background: #059669; color: white; margin-top: 12px; }
    .btn:disabled { background: #94a3b8; border-color: #94a3b8; color: white; }
    .note { font-size: 0.75rem; color: #64748b; margin-top: 4px; line-height: 1.4; }
    #status { margin-top: 12px; font-size: 0.85rem; color: #475569; line-height: 1.4; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px 6px; text-align: left; }
    th { background: #f8fafc; color: #475569; }
    .hidden-file { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>1. 初期設定</h1>
    <label for="apiKey">Gemini APIキー</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." />
    
    <label for="gasUrl">Google Apps Script ウェブアプリURL</label>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec" />
    
    <button class="btn btn-primary" onclick="saveSettings()" style="padding: 10px; font-size: 0.85rem;">設定を端末に保存</button>
  </div>

  <div class="card">
    <h1>2. 勤務表の読み込み</h1>
    <input type="file" id="fileInputCamera" class="hidden-file" accept="image/*" capture="environment">
    <input type="file" id="fileInputGallery" class="hidden-file" accept="image/*">

    <button class="btn btn-primary" id="btnScan" onclick="triggerInput('fileInputCamera')">
      📷 カメラでスキャン
    </button>
    <button class="btn btn-outline" id="btnGallery" onclick="triggerInput('fileInputGallery')">
      🖼️ 写真アルバムから選択
    </button>
    
    <div class="note">
      ※ 画像データはブラウザのメモリ内でのみ一時処理され、解析後に即座に消去されます。
    </div>
    <div id="status">準備完了</div>
  </div>

  <div class="card" id="resultCard" style="display: none;">
    <h1>3. 抽出結果（森川 瑛理 様）</h1>
    <table>
      <thead>
        <tr><th>日付</th><th>シフト名</th><th>時間帯</th></tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
    <button class="btn btn-secondary" id="syncBtn" onclick="syncToGoogleCalendar()">Googleカレンダーに直接一括登録</button>
  </div>

  <script>
    let shifts = [];

    window.onload = () => {
      const savedKey = localStorage.getItem("GEMINI_KEY");
      const savedGas = localStorage.getItem("GAS_URL");
      if (savedKey) document.getElementById("apiKey").value = savedKey;
      if (savedGas) document.getElementById("gasUrl").value = savedGas;
    };

    function saveSettings() {
      const key = document.getElementById("apiKey").value.trim();
      const gas = document.getElementById("gasUrl").value.trim();
      if (!key) return alert("Gemini APIキーを入力してください");
      if (!gas) return alert("GASのウェブアプリURLを入力してください");

      localStorage.setItem("GEMINI_KEY", key);
      localStorage.setItem("GAS_URL", gas);
      alert("設定を端末に保存しました。次回以降は入力不要です。");
    }

    function triggerInput(id) {
      const key = localStorage.getItem("GEMINI_KEY") || document.getElementById("apiKey").value.trim();
      const gas = localStorage.getItem("GAS_URL") || document.getElementById("gasUrl").value.trim();
      if (!key || !gas) return alert("先にAPIキーとGASのURLを設定・保存してください。");
      document.getElementById(id).click();
    }

    document.getElementById("fileInputCamera").addEventListener("change", handleFileSelect);
    document.getElementById("fileInputGallery").addEventListener("change", handleFileSelect);

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById("status");
      const btnScan = document.getElementById("btnScan");
      const btnGallery = document.getElementById("btnGallery");
      
      btnScan.disabled = true;
      btnGallery.disabled = true;
      status.innerText = "勤務表を解析中（森川様の行とシフト定義を突き合わせています）...";

      let base64Image = null;

      try {
        base64Image = await toBase64(file);
        const key = localStorage.getItem("GEMINI_KEY") || document.getElementById("apiKey").value.trim();
        
        shifts = await analyzeWithGeminiWithRetry(base64Image, file.type, key);
        
        renderTable(shifts);
        status.innerText = `解析成功: ${shifts.length}件の勤務を検出しました。`;
        document.getElementById("resultCard").style.display = "block";
      } catch (err) {
        status.innerText = "エラー: " + err.message;
      } finally {
        base64Image = null;
        e.target.value = "";
        btnScan.disabled = false;
        btnGallery.disabled = false;
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 混雑時に自動リトライを行う制御関数
    async function analyzeWithGeminiWithRetry(base64Data, mimeType, apiKey) {
      const maxRetries = 3;
      const statusEl = document.getElementById("status");

      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          return await callGeminiApi(base64Data, mimeType, apiKey);
        } catch (err) {
          const errMsg = err.message || "";
          const isHighDemand = errMsg.includes("high demand") || errMsg.includes("503") || errMsg.includes("429");

          if (isHighDemand && attempt < maxRetries) {
            const waitSec = attempt * 3; // 1回目: 3秒待機, 2回目: 6秒待機
            statusEl.innerText = `サーバー混雑中（高負荷）です。${waitSec}秒後に自動で再試行します (${attempt}/${maxRetries}回目)...`;
            await new Promise(resolve => setTimeout(resolve, waitSec * 1000));
            statusEl.innerText = `再試行中 (${attempt + 1}/${maxRetries}回目)...`;
          } else {
            throw err;
          }
        }
      }
    }

    // Gemini API 呼び出し本体
    async function callGeminiApi(base64Data, mimeType, apiKey) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const prompt = `画像は「作業計画実施表」という月間の勤務表です。以下の厳密なルールに従って解析し、JSON配列を出力してください。

1. 年月の特定:
   左上の記載から対象の「西暦の年」と「月」（例: 2026年11月）を特定してください。
2. シフト時間定義の抽出:
   右上にあるアルファベット等の記号と時間の定義をすべて読み取ってください。
   ※大文字と小文字（Aとa、Fとfなど）、記号付き（A★、N△）、併記（n/N、e/E）を厳密に区別してください。
3. 対象者の特定:
   左側の氏名列から「森川 瑛理」（文字間のスペースの有無は問いません）の行を特定してください。
4. 日付とシフトの抽出:
   日付（1〜30/31）と、森川瑛理さんの行にある各セルの記号を突き合わせます。
   ※重要: 「-（ハイフン）」、「休」、「有」、「FB」など、右上に具体的な時間定義が存在しないセルは予定がないものとして【必ずリストから除外】してください。
   右上に時間定義が存在する記号の日のみを抽出し、開始時刻と終了時刻を割り当ててください。

以上の結果を、指定されたJSONスキーマに従って出力してください。
- dateは "YYYY-MM-DD" 形式（月日は必ず2桁で0埋め、例: 2026-11-03）
- titleは "シフト(記号)" 形式（例: シフト(A)）
- startTimeとendTimeは "HH:mm" 形式（例: 06:00, 15:00）`;

      const payload = {
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64Data } }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json",
          response_schema: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                date: { type: "STRING", description: "YYYY-MM-DD" },
                title: { type: "STRING", description: "例: シフト(A)" },
                startTime: { type: "STRING", description: "HH:mm" },
                endTime: { type: "STRING", description: "HH:mm" }
              },
              required: ["date", "title", "startTime", "endTime"]
            }
          }
        }
      };

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `API通信失敗 (${res.status})`);
      }

      const json = await res.json();
      return JSON.parse(json.candidates[0].content.parts[0].text);
    }

    function renderTable(data) {
      const tbody = document.getElementById("resultBody");
      tbody.innerHTML = "";
      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${item.date}</td><td>${item.title}</td><td>${item.startTime}〜${item.endTime}</td>`;
        tbody.appendChild(tr);
      });
    }

    async function syncToGoogleCalendar() {
      if (!shifts.length) return;

      const gasUrl = localStorage.getItem("GAS_URL") || document.getElementById("gasUrl").value.trim();
      if (!gasUrl) return alert("GASのURLが設定されていません。");

      const syncBtn = document.getElementById("syncBtn");
      syncBtn.disabled = true;
      syncBtn.innerText = "Googleカレンダーに同期中...";

      try {
        await fetch(gasUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ shifts: shifts })
        });

        alert(`Googleカレンダーへの同期リクエストを送信しました！\n（${shifts.length}件の予定）`);
      } catch (err) {
        alert("同期中にエラーが発生しました: " + err.message);
      } finally {
        syncBtn.disabled = false;
        syncBtn.innerText = "Googleカレンダーに直接一括登録";
      }
    }
  </script>
</body>
</html>
